<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151b38"><title>History Quest — Dictatures des années 1930</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#f5f6ff;background:#10162e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#354a83,#10162e 65%);min-height:100vh}header{padding:28px 18px;text-align:center}h1{font-size:clamp(30px,6vw,56px);margin:5px}h2{margin:0 0 12px}.sub{color:#d0dbff}.wrap{max-width:950px;margin:auto;padding:12px 18px 50px}.nav{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:12px auto 25px}button{border:0;border-radius:14px;padding:12px 16px;font-weight:750;cursor:pointer;background:#ffca64;color:#17203d;font-size:15px}button:hover{filter:brightness(1.08)}button:disabled{opacity:.45;cursor:default}.nav button{background:#34476f;color:white}.nav button.active{background:#ffca64;color:#16203c}.panel{background:#202b50;border:1px solid #6175a0;border-radius:22px;padding:22px;margin:16px 0;box-shadow:0 10px 25px #070b1c55}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.tile{background:#29375f;border-radius:18px;padding:18px;border:1px solid #536891}.tile h3{margin-top:0;color:#ffdb91}.tag{display:inline-block;padding:6px 11px;border-radius:50px;background:#394e7b;color:#dce7ff;font-size:13px;margin:3px}.muted{color:#cbd6f5}.question{font-size:21px;font-weight:750;margin:14px 0}.answers{display:grid;gap:10px}.answers button{background:#354976;color:white;text-align:left;border:1px solid #6b80aa}.answers button.correct{background:#167a65}.answers button.wrong{background:#a44458}.feedback{padding:14px;border-radius:14px;background:#182744;margin:14px 0;line-height:1.6}.progress{height:13px;background:#101a35;border-radius:20px;overflow:hidden}.progress span{display:block;background:#ffca64;height:100%;transition:width .2s}.date{color:#ffca64;font-weight:900;font-size:22px}.timeline{border-left:3px solid #ffca64;padding-left:20px;margin-left:10px}.event{position:relative;margin:20px 0}.event:before{content:'';position:absolute;left:-29px;top:7px;background:#ffca64;width:14px;height:14px;border-radius:50%}select{padding:12px;border-radius:12px;width:100%;background:#eff3ff;color:#142047;font-size:16px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.score{color:#ffda7d;font-weight:800}.hidden{display:none}footer{text-align:center;color:#9badd5;padding:20px;font-size:13px}p,li{line-height:1.65}ul{padding-left:22px}details{background:#172445;padding:12px;border-radius:12px;margin:9px 0}summary{cursor:pointer;font-weight:700}@media(max-width:500px){.panel{padding:16px}.nav button{padding:10px 12px;font-size:13px}}</style></head><body><header><div>📜 🧭 🏛️</div><h1>HISTORY QUEST</h1><div class="sub">Mission 3e · Comprendre les régimes totalitaires des années 1930</div></header><main class="wrap"><div class="nav" id="nav"></div><div id="app"></div></main><footer>Révisions d'histoire · Sources : notes de cours fournies · Fonctionne hors connexion après téléchargement</footer><script>
const chapters=[{name:'Allemagne nazie',icon:'🇩🇪',color:'#ffba74',text:'En 1933, Hitler devient chancelier puis établit une dictature à parti unique (NSDAP). L’idéologie nazie est raciste, antisémite et expansionniste. Le régime contrôle la population par la propagande, la censure et les Jeunesses hitlériennes. La Gestapo et les SS participent à la répression. Les lois de Nuremberg (1935) privent les Juifs de droits fondamentaux. En novembre 1938, la « Nuit de cristal » marque une intensification des violences antisémites. L’économie est dirigée vers les grands travaux et le réarmement.',terms:[['NSDAP','Parti nazi, seul parti autorisé sous la dictature.'],['Gestapo','Police politique secrète du régime nazi.'],['Antisémitisme','Hostilité et discrimination envers les Juifs.'],['Propagande','Messages destinés à influencer les opinions et les comportements.'],['Autodafé','Destruction publique de livres, souvent par le feu.']]},{name:'URSS de Staline',icon:'🌾',color:'#a5ddff',text:'Après la mort de Lénine en 1924, Staline consolide son pouvoir. À partir de 1928-1929, l’État impose la planification économique, la collectivisation des terres et la priorité à l’industrie lourde. Les paysans sont poussés vers les kolkhozes. Le parti communiste domine la vie politique. La propagande développe le culte de la personnalité de Staline. Le NKVD, police politique, participe à la répression. Pendant la Grande Terreur (1937-1938), de nombreuses personnes sont arrêtées, déportées ou exécutées. Les camps du Goulag exploitent le travail forcé.',terms:[['Kolkhoze','Exploitation agricole collective soviétique.'],['Plan quinquennal','Plan fixant des objectifs économiques sur cinq ans.'],['Collectivisation','Regroupement forcé des terres et exploitations agricoles.'],['NKVD','Organisme soviétique chargé notamment de la police politique.'],['Goulag','Système de camps de travail forcé soviétiques.']]},{name:'Comparer les régimes',icon:'⚖️',color:'#b5f0c9',text:'Les deux régimes sont des dictatures à parti unique : ils utilisent la propagande, le culte du chef, l’encadrement de la jeunesse, la censure et la terreur politique. Ils contrôlent largement l’économie. Mais leurs idéologies et leurs politiques diffèrent : le nazisme repose sur le racisme, l’antisémitisme et la conquête territoriale ; le stalinisme affirme vouloir construire une société communiste et impose la collectivisation et la planification. Comparer ne signifie pas confondre les deux systèmes.',terms:[['État totalitaire','Régime cherchant à contrôler la vie politique, sociale et les idées.'],['Culte de la personnalité','Mise en scène du chef présenté comme exceptionnel.'],['Parti unique','Un seul parti autorisé à exercer le pouvoir.'],['Censure','Contrôle ou interdiction de certaines informations ou œuvres.']]}];
const events=[['1924','Mort de Lénine ; Staline renforce progressivement son pouvoir.'],['1928-1929','Lancement de la planification et de la collectivisation en URSS.'],['1933','Hitler devient chancelier et met en place la dictature nazie.'],['1935','Lois de Nuremberg contre les Juifs en Allemagne.'],['1936','Plan de quatre ans : accélération de la préparation économique allemande à la guerre.'],['1937-1938','Grande Terreur stalinienne en URSS.'],['1938','« Nuit de cristal » : violences antisémites organisées dans l’Allemagne nazie.']];
const questions=[
['En quelle année Hitler devient-il chancelier ?', ['1924','1929','1933','1938'],2,'Hitler est nommé chancelier le 30 janvier 1933.'],
['Quel est le parti unique de l’Allemagne nazie ?', ['NKVD','NSDAP','Kolkhoze','Goulag'],1,'Le NSDAP est le parti nazi.'],
['À quoi servent les Jeunesses hitlériennes ?', ['À encadrer et endoctriner les jeunes','À élire le chancelier','À diriger les banques','À organiser les kolkhozes'],0,'Le régime encadre les jeunes et cherche à leur inculquer son idéologie.'],
['Qu’est-ce que la Gestapo ?', ['Un syndicat','Une police politique secrète','Une ferme collective','Un plan économique'],1,'La Gestapo est la police secrète du régime nazi.'],
['Que font les lois de Nuremberg de 1935 ?', ['Elles accordent le vote aux femmes','Elles privent les Juifs de droits fondamentaux','Elles créent le Goulag','Elles suppriment la propagande'],1,'Ces lois instaurent une discrimination juridique antisémite.'],
['Quel événement antisémite se produit en novembre 1938 ?', ['La Grande Terreur','La Nuit de cristal','La mort de Lénine','La collectivisation'],1,'La « Nuit de cristal » correspond à des violences antisémites organisées.'],
['Quel objectif économique devient central pour l’Allemagne nazie ?', ['Le désarmement','Le réarmement','La fin de l’industrie','La suppression des routes'],1,'Le régime développe notamment le réarmement et les grands travaux.'],
['Quel dirigeant meurt en 1924 ?', ['Staline','Hitler','Lénine','Trotsky'],2,'Lénine meurt en 1924 ; Staline consolide ensuite son pouvoir.'],
['Qu’est-ce qu’un kolkhoze ?', ['Une police politique','Une ferme collective','Un journal','Un parti'],1,'Un kolkhoze est une exploitation agricole collective soviétique.'],
['À quoi sert un plan quinquennal ?', ['À planifier l’économie sur cinq ans','À organiser une élection','À recruter des espions','À contrôler la presse uniquement'],0,'Le pouvoir soviétique fixe des objectifs économiques sur cinq ans.'],
['Quel secteur est prioritaire sous Staline ?', ['Le tourisme','L’industrie lourde','La publicité','Le commerce de luxe'],1,'Le régime privilégie notamment le charbon, la sidérurgie et les équipements industriels.'],
['Quel organisme joue un rôle de police politique en URSS ?', ['NSDAP','Gestapo','NKVD','Jeunesses hitlériennes'],2,'Le NKVD joue un rôle majeur dans la répression soviétique.'],
['Que désigne le Goulag ?', ['Un réseau de camps de travail forcé','Un programme scolaire','Une autoroute','Une fête nationale'],0,'Le Goulag désigne le système soviétique de camps de travail forcé.'],
['Quand a lieu la Grande Terreur stalinienne ?', ['1914-1918','1920-1921','1937-1938','1949-1950'],2,'La Grande Terreur atteint une intensité majeure en 1937-1938.'],
['Qu’est-ce que le culte de la personnalité ?', ['Critiquer librement le chef','Présenter le chef comme exceptionnel','Organiser plusieurs partis','Supprimer les portraits officiels'],1,'La propagande valorise et glorifie le dirigeant.'],
['Quel outil les deux régimes utilisent-ils ?', ['Le pluralisme politique','La presse totalement libre','La propagande','Des élections concurrentielles libres'],2,'Les deux dictatures utilisent la propagande pour influencer la population.'],
['Quelle politique est propre au régime stalinien parmi ces propositions ?', ['La collectivisation agricole','Les lois de Nuremberg','Les Jeunesses hitlériennes','La Nuit de cristal'],0,'La collectivisation forcée des terres est centrale dans la politique stalinienne.'],
['Quelle idée caractérise l’idéologie nazie ?', ['L’égalité de toutes les races','L’antisémitisme racial','Le pluralisme démocratique','La liberté de la presse'],1,'L’idéologie nazie est fondée sur une hiérarchie raciale fictive et l’antisémitisme.'],
['Que signifie « parti unique » ?', ['Tous les partis gouvernent ensemble','Un seul parti est autorisé à exercer le pouvoir','Les citoyens changent de parti chaque année','Le chef est élu par plusieurs partis libres'],1,'Dans ces dictatures, l’opposition politique est interdite.'],
['Pourquoi parle-t-on de « terreur » ?', ['Parce que les régimes abolissent la police','Parce que la violence et la répression servent à imposer le pouvoir','Parce que la presse est indépendante','Parce que les opposants gouvernent'],1,'Les régimes utilisent arrestations, déportations et violences pour réprimer leurs opposants.']];
const sortItems=[['Gestapo','Allemagne nazie'],['Kolkhozes','URSS stalinienne'],['Jeunesses hitlériennes','Allemagne nazie'],['NKVD','URSS stalinienne'],['Lois de Nuremberg','Allemagne nazie'],['Plans quinquennaux','URSS stalinienne'],['Propagande','Les deux'],['Culte de la personnalité','Les deux'],['Parti unique','Les deux'],['Goulag','URSS stalinienne'],['Antisémitisme racial officiel','Allemagne nazie'],['Censure','Les deux']];
let page='accueil',quizIndex=0,quizScore=0,quizLocked=false,sortIndex=0,sortScore=0;let best=Number(localStorage.getItem('historyquest_best')||0);const app=document.getElementById('app');const nav=document.getElementById('nav');const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;');function go(p){page=p;render();window.scrollTo(0,0)}function renderNav(){nav.innerHTML=[['accueil','🏠 Accueil'],['cours','📚 Fiches'],['frise','🗓️ Frise'],['tri','⚖️ Comparer'],['quiz','🏆 Quiz']].map(([id,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${t}</button>`).join('')}function render(){renderNav();if(page==='accueil')app.innerHTML=`<section class="panel"><h2>🎯 Ta mission</h2><p>Comprends comment Hitler et Staline ont installé et exercé leur pouvoir dans les années 1930. Explore les fiches, reconstitue les repères, compare les régimes et relève le défi final.</p><div class="row"><span class="tag">Niveau 3e</span><span class="tag">20 questions corrigées</span><span class="tag">Sans inscription</span><span class="score">Meilleur score : ${best}/20</span></div></section><div class="grid"><div class="tile"><h3>📚 1. Les archives</h3><p>Trois fiches de cours et un lexique essentiel.</p><button onclick="go('cours')">Réviser</button></div><div class="tile"><h3>🗓️ 2. Le voyage temporel</h3><p>Retrouve les dates clés des années 1920 et 1930.</p><button onclick="go('frise')">Explorer</button></div><div class="tile"><h3>⚖️ 3. Qui fait quoi ?</h3><p>Classe les faits : Allemagne, URSS ou les deux.</p><button onclick="startSort()">Jouer</button></div><div class="tile"><h3>🏆 4. Le grand défi</h3><p>20 questions, explications immédiates et score final.</p><button onclick="startQuiz()">Commencer</button></div></div>`;if(page==='cours')app.innerHTML=`<h2>📚 Les archives de l'historien</h2><div class="grid">${chapters.map(c=>`<article class="tile"><h3>${c.icon} ${c.name}</h3><p>${c.text}</p><h4>🔑 Mots-clés</h4>${c.terms.map(t=>`<details><summary>${t[0]}</summary><p>${t[1]}</p></details>`).join('')}</article>`).join('')}</div><section class="panel"><h3>🧠 Méthode pour une réponse rédigée</h3><p>1. Nomme le régime et le dirigeant. 2. Explique son idéologie. 3. Décris les moyens de contrôle et de répression. 4. Ajoute au moins un exemple daté.</p></section>`;if(page==='frise')app.innerHTML=`<section class="panel"><h2>🗓️ Frise des événements</h2><p class="muted">Lis les repères dans l’ordre chronologique puis essaie de les réciter sans regarder.</p><div class="timeline">${events.map(e=>`<div class="event"><div class="date">${e[0]}</div><div>${e[1]}</div></div>`).join('')}</div></section>`;if(page==='quiz')renderQuiz();if(page==='tri')renderSort()}
function startQuiz(){quizIndex=0;quizScore=0;quizLocked=false;go('quiz')}function renderQuiz(){if(quizIndex>=questions.length){best=Math.max(best,quizScore);localStorage.setItem('historyquest_best',best);app.innerHTML=`<section class="panel" style="text-align:center"><h2>🏆 Mission terminée !</h2><div style="font-size:54px">${quizScore>=16?'🌟':quizScore>=10?'👏':'📚'}</div><h1>${quizScore}/20</h1><p>${quizScore>=16?'Excellent travail !':quizScore>=10?'Bien joué, continue à réviser les notions difficiles.':'Relis les fiches puis retente le défi.'}</p><button onclick="startQuiz()">Rejouer</button> <button onclick="go('cours')">Revoir les fiches</button></section>`;return}let q=questions[quizIndex];app.innerHTML=`<section class="panel"><div class="row"><span class="tag">Question ${quizIndex+1}/20</span><span class="score">⭐ ${quizScore} point(s)</span></div><div class="progress"><span style="width:${quizIndex/20*100}%"></span></div><div class="question">${esc(q[0])}</div><div class="answers">${q[1].map((a,i)=>`<button id="answer${i}" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}</div><div id="result"></div></section>`}function answer(i){if(quizLocked)return;quizLocked=true;let q=questions[quizIndex],ok=i===q[2];if(ok)quizScore++;q[1].forEach((_,j)=>{let b=document.getElementById('answer'+j);b.disabled=true;if(j===q[2])b.classList.add('correct');else if(j===i)b.classList.add('wrong')});document.getElementById('result').innerHTML=`<div class="feedback"><b>${ok?'✅ Bonne réponse !':'💡 À retenir'}</b><p>${q[3]}</p></div><button onclick="quizIndex++;quizLocked=false;renderQuiz()">${quizIndex===19?'Voir mon score':'Question suivante →'}</button>`}function startSort(){sortIndex=0;sortScore=0;go('tri')}function renderSort(){if(sortIndex>=sortItems.length){app.innerHTML=`<section class="panel"><h2>⚖️ Comparaison terminée</h2><h1>${sortScore}/${sortItems.length}</h1><p>Les deux dictatures partagent des méthodes de contrôle, mais leurs idéologies et politiques ne sont pas identiques.</p><button onclick="startSort()">Rejouer</button></section>`;return}let x=sortItems[sortIndex];app.innerHTML=`<section class="panel"><div class="row"><span class="tag">Carte ${sortIndex+1}/${sortItems.length}</span><span class="score">⭐ ${sortScore}</span></div><div class="progress"><span style="width:${sortIndex/sortItems.length*100}%"></span></div><h2>⚖️ Qui fait quoi ?</h2><p>À quel régime associer cette notion ?</p><div class="question" style="text-align:center;background:#354976;padding:25px;border-radius:15px">${x[0]}</div><div class="answers">${['Allemagne nazie','URSS stalinienne','Les deux'].map((t,i)=>`<button id="sort${i}" onclick="chooseSort(${i})">${t}</button>`).join('')}</div><div id="sortresult"></div></section>`}function chooseSort(i){let options=['Allemagne nazie','URSS stalinienne','Les deux'],correct=sortItems[sortIndex][1],ok=options[i]===correct;if(ok)sortScore++;options.forEach((v,j)=>{let b=document.getElementById('sort'+j);b.disabled=true;if(v===correct)b.classList.add('correct');else if(i===j)b.classList.add('wrong')});document.getElementById('sortresult').innerHTML=`<div class="feedback">${ok?'✅ Exact !':'💡 À retenir : '+correct}</div><button onclick="sortIndex++;renderSort()">Continuer →</button>`}render();</script></body></html>
